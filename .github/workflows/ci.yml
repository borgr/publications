name: pipeline

# Deliberately does NOT scrape Google Scholar. Scholar blocks datacenter IP
# ranges, so a hosted runner reliably gets a CAPTCHA rather than data -- a
# scheduled cloud fetch would fail every week and train you to ignore it. The
# fetch belongs on your own machine (see launchd/ in this repo); CI's job is to
# prove that the code and the committed data still produce the right output.
#
# Everything here works in a fork with no secrets configured.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly, so bit-rot in a dependency surfaces even with no commits.
    # 07:23 Monday, off the hour to avoid the scheduling stampede.
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # Fast and first: a syntax error or an undefined name in a rarely-run script
    # is the kind of thing that only surfaces months later, during the one run
    # of the year that needed it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        # Only ruff: linting must not wait on pandas.
        run: pip install "$(grep -E '^ruff' requirements-dev.txt)"

      - name: Lint
        # The rules and their exceptions live in pyproject.toml, so this is the
        # same command a contributor runs locally.
        run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what the code actually requires (str | None unions,
        # the walrus in pipeline_state); the ceiling catches upcoming breakage.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The Overleaf submodule is a private remote; CI neither needs nor can
          # reach it, and the offline rebuild is checked against a temp copy.
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Tests
        if: matrix.python-version != '3.12'
        # -rs: the tests that assert against the real Overleaf project skip here,
        # because this job checks out without the submodule. That is intended, but
        # a bare "730 passed" reads as though they ran. Print the reasons so a
        # green run says which checks it did not perform.
        run: python -m pytest tests/ -q -rs

      - name: Tests, with the coverage floor
        # Measured on one interpreter only. The floor is a property of the test
        # suite, not of the Python version, and enforcing it three times means a
        # version-gated branch can fail the gate on 3.10 while passing on 3.13 --
        # three red jobs for one missing test, and no way to tell that from a real
        # incompatibility. The thresholds and exclusions live in pyproject.toml.
        if: matrix.python-version == '3.12'
        run: python -m pytest tests/ -q -rs --cov

  floor:
    # Does the lowest version each pin claims to accept actually work?
    #
    # requirements.txt deliberately uses `>=` rather than exact pins, which means
    # a fresh install gets today's releases and the floors are never exercised by
    # anything. A forker installing into an older environment is the one person
    # who finds out, and they have no way to tell a bad floor from their own
    # mistake. This resolves every `>=` to `==` and runs the suite against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v7
        with:
          # The oldest supported interpreter, because the oldest dependencies are
          # the ones with no wheels for the newest one.
          python-version: "3.10"

      - name: Pin every floor exactly
        run: |
          sed -E 's/>=/==/' requirements.txt > floor.txt
          echo "pytest==7.4" >> floor.txt
          cat floor.txt

      - name: Install the floor
        run: pip install -r floor.txt

      - name: Tests against the floor
        run: python -m pytest tests/ -q

  rebuild:
    # Proves the committed data still builds, and that rebuilding is
    # deterministic -- the bibliography must not change just because it ran again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Rebuild the bibliography from committed data
        run: |
          mkdir -p overleaf
          python build_bib.py | tee build.log

      - name: Fail if the build reported a data problem
        run: |
          # Duplicate rows and ambiguous joins are surfaced as warnings by
          # build_bib; in CI they are worth failing on, because they mean the
          # committed table cannot produce one unambiguous CV.
          if grep -qE "^(Warning: [0-9]+ table rows are the same paper|AMBIGUOUS)" build.log; then
            echo "::error title=Publications data::The table has duplicate rows or an ambiguous citation join. See WORKLIST.md."
            grep -E "^(Warning|AMBIGUOUS)" build.log || true
            exit 1
          fi

      - name: Rebuild is deterministic
        run: |
          cp overleaf/Wzmn.bib /tmp/first.bib
          python build_bib.py > /dev/null
          diff /tmp/first.bib overleaf/Wzmn.bib \
            || { echo "::error::Two consecutive builds differ — the output is not deterministic."; exit 1; }

      - name: Worklist is current
        run: |
          python scripts/worklist.py --quiet || true
          if ! git diff --quiet -- WORKLIST.md; then
            echo "::warning title=WORKLIST.md is stale::Regenerate with 'python scripts/worklist.py' and commit."
            git --no-pager diff -- WORKLIST.md | head -60
          fi

  fork:
    # Can somebody else actually use this?
    #
    # The author's own machine cannot answer that: it has the Overleaf
    # credentials in its keychain, so git quietly authenticates and the
    # fork-only failures never appear. Two shipped bugs came from exactly that
    # blind spot -- the documented clone aborted on the private submodule, and
    # init_new_author.py reset main.tex from a template that only exists inside
    # the original author's Overleaf project.
    #
    # So: clone as a stranger, with credentials actively disabled, and drive the
    # documented fork path end to end. No secrets, and none usable if there were.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Clone exactly as the README says
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # credential.helper= disables any ambient helper, so an authenticated
          # runner cannot mask a failure a real forker would hit.
          git -c credential.helper= clone --quiet \
            "https://github.com/${GITHUB_REPOSITORY}.git" fork
          cd fork
          test ! -s overleaf/main.tex \
            && echo "overleaf/ is unpopulated, as expected for a fork"

      - name: Install
        run: pip install -r fork/requirements-dev.txt

      - name: A stand-in for the forker's own Overleaf project
        run: |
          # A bare local repo: the fork path must not need the real Overleaf.
          git init -q --bare "$RUNNER_TEMP/their-overleaf.git"
          git init -q "$RUNNER_TEMP/seed" && cd "$RUNNER_TEMP/seed"
          git config user.email f@example.com && git config user.name f
          git commit -q --allow-empty -m "empty project"
          git push -q "$RUNNER_TEMP/their-overleaf.git" HEAD:refs/heads/master

      - name: Run the documented fork path
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: protocol.file.allow
          GIT_CONFIG_VALUE_0: always
        run: |
          cd fork
          git config user.email f@example.com
          git config user.name f
          python init_new_author.py --yes \
            --overleaf-url "$RUNNER_TEMP/their-overleaf.git"

      - name: The fork points at its own project, not the original
        run: |
          cd fork
          if grep -q "git.overleaf.com" .gitmodules; then
            echo "::error title=Fork still points at the original project::init_new_author.py left .gitmodules pointing at git.overleaf.com."
            cat .gitmodules
            exit 1
          fi
          test -s overleaf/main.tex || {
            echo "::error title=No main.tex::The fork path left no CV to build."; exit 1; }

      - name: No personal data survived
        run: |
          cd fork
          # A name and a Scholar ID in config.py are the author's, and the
          # README tells the forker to edit them; the data files must be empty.
          for f in citations.csv papers.csv orig.bib; do
            # awk, not `grep -c . || echo 0`: on an empty file grep prints 0 and
            # also exits 1, so the fallback appends a second 0 and the numeric
            # comparison below dies on "0\n0".
            rows=$(awk 'NF' "$f" 2>/dev/null | wc -l | tr -d ' ')
            if [ "$rows" -gt 1 ]; then
              echo "::error title=Personal data survived::$f still has $rows lines."
              exit 1
            fi
          done
          python - <<'PY'
          import json
          s = json.load(open("profile_stats.json"))
          assert s == {"citations": 0, "h_index": 0}, s
          print("profile_stats.json zeroed")
          PY

      - name: The pipeline still builds from empty
        run: |
          cd fork
          # The real test of a usable fork: an empty table must produce a CV
          # rather than a traceback.
          python rebuild_tex.py
          test -f overleaf/Wzmn.bib && echo "built an empty bibliography"
          python scripts/worklist.py --quiet && echo "worklist generated"

  overleaf:
    # Does the Overleaf project actually match the committed data?
    #
    # This job exists because that question had no answer anywhere. Every local
    # run was made with --no-push, so main.tex and Wzmn.bib were correct on disk
    # while Overleaf served a CV that was hundreds of citations out of date --
    # and every run reported success, because generating the files *was* the
    # success. Compiling in Overleaf was the only way to find out.
    #
    # Fork-safe: with no OVERLEAF_GIT_URL secret the job explains itself and
    # passes. It is skipped on pull_request, where secrets are unavailable to
    # forked PRs by design.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Is an Overleaf project configured?
        id: cfg
        env:
          OVERLEAF_GIT_URL: ${{ secrets.OVERLEAF_GIT_URL }}
        run: |
          if [ -n "$OVERLEAF_GIT_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Overleaf check skipped::No OVERLEAF_GIT_URL secret is set, so CI cannot see your Overleaf project. To enable it, add a repository secret OVERLEAF_GIT_URL containing your Overleaf git URL with a token (Overleaf → Menu → Git). Without it, publishing is verified only by the local run."
          fi

      - name: Clone the Overleaf project
        if: steps.cfg.outputs.configured == 'true'
        env:
          OVERLEAF_GIT_URL: ${{ secrets.OVERLEAF_GIT_URL }}
        run: |
          # --quiet, and the URL only ever via the environment: it carries a token.
          # GIT_TERMINAL_PROMPT=0 so a credential-less URL fails immediately
          # instead of blocking on a password prompt no one can answer.
          if ! GIT_TERMINAL_PROMPT=0 git clone --quiet --depth 1 "$OVERLEAF_GIT_URL" overleaf 2>clone.err; then
            sed -E 's#//[^@]*@#//***@#g' clone.err
            echo "::error title=Cannot reach Overleaf::Cloning the project failed. The most common cause is a URL with no token in it: Overleaf shows the project URL and the git token separately, and OVERLEAF_GIT_URL needs both, as https://git:TOKEN@git.overleaf.com/PROJECT_ID. See the README."
            exit 1
          fi

      - name: Rebuild the CV from committed data
        if: steps.cfg.outputs.configured == 'true'
        run: python rebuild_tex.py

      - name: Overleaf matches the committed data
        if: steps.cfg.outputs.configured == 'true'
        env:
          # Opt in by setting a repository variable PUBLISH_TO_OVERLEAF to "true".
          # Off by default: pushing to Overleaf is a visible, outward-facing edit
          # to a document you may be editing yourself, so it is a decision rather
          # than a default.
          PUBLISH: ${{ vars.PUBLISH_TO_OVERLEAF }}
        run: |
          cd overleaf
          # --porcelain, not `git diff --quiet`: a file the project does not have
          # yet is untracked, and a diff cannot see it. That is exactly the state
          # of a fresh fork whose Overleaf project has no Wzmn.bib, which would
          # otherwise be reported as up to date.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Overleaf is up to date with the committed data."
            exit 0
          fi
          echo "The compiled CV in Overleaf does not match the committed data:"
          git status --short
          if [ "$PUBLISH" != "true" ]; then
            echo "::error title=Overleaf is stale::Overleaf would compile an out-of-date CV. Run 'python update.py' locally to publish, or set the repository variable PUBLISH_TO_OVERLEAF=true to let CI push it."
            exit 1
          fi
          git config user.name "publications-ci"
          git config user.email "publications-ci@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish publications data from CI"
          # Overleaf's own editor advances the remote, so rebase before retrying
          # rather than failing on a race with a human edit.
          git push origin || { git pull --rebase --autostash origin && git push origin; }
          echo "::notice title=Overleaf updated::Pushed the rebuilt CV to Overleaf."
